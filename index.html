<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFlow · cozy & bubbly</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ---------- GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fbe9f0 0%, #f5d8e7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* ---------- AUTH CARD (bubbly) ---------- */
    .auth-container {
      background: rgba(255, 245, 250, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 48px;
      padding: 36px 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 50px -15px rgba(200, 120, 160, 0.4), inset 0 0 0 2px rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 220, 240, 0.6);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .auth-container::before {
      content: "🌸";
      position: absolute;
      top: -10px;
      right: 0px;
      font-size: 70px;
      opacity: 0.15;
      transform: rotate(15deg);
    }

    .auth-container::after {
      content: "🫧";
      position: absolute;
      bottom: 10px;
      left: 5px;
      font-size: 60px;
      opacity: 0.12;
      transform: rotate(-10deg);
    }

    .auth-container h2 {
      text-align: center;
      color: #9b4f7a;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 28px;
      font-size: 2.2rem;
      text-shadow: 0 4px 10px rgba(255, 200, 220, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Quicksand', 'Segoe UI', sans-serif;
    }

    .auth-container h2 i {
      color: #e06b9a;
      font-size: 2rem;
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #d98bb0;
      font-size: 1.2rem;
      pointer-events: none;
    }

    .input-group input {
      width: 100%;
      padding: 16px 18px 16px 52px;
      background: #fff7fc;
      border: 2px solid #ffd9e9;
      border-radius: 60px;
      color: #5a3a4a;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
      font-weight: 500;
      box-shadow: inset 0 2px 8px rgba(255, 200, 220, 0.2);
    }

    .input-group input::placeholder {
      color: #d4a5be;
      font-weight: 400;
    }

    .input-group input:focus {
      border-color: #f7a8c9;
      background: #fffaff;
      box-shadow: 0 0 0 5px rgba(247, 168, 201, 0.2), inset 0 2px 8px rgba(255, 200, 220, 0.3);
    }

    .auth-btn {
      width: 100%;
      padding: 16px;
      border-radius: 60px;
      border: none;
      background: linear-gradient(135deg, #f28bb8, #e06b9a);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 12px 22px -6px #e06b9a80, 0 0 0 2px #ffffff80 inset;
      margin-top: 6px;
      font-family: 'Quicksand', sans-serif;
    }

    .auth-btn:hover {
      background: linear-gradient(135deg, #f79ec4, #e87aaa);
      transform: scale(1.02);
      box-shadow: 0 18px 30px -8px #e06b9ab0, 0 0 0 2px #ffffffb0 inset;
    }

    .auth-btn:active {
      transform: scale(0.97);
    }

    .toggle-text {
      text-align: center;
      margin-top: 20px;
      color: #b58aa4;
      font-size: 1rem;
      font-weight: 500;
    }

    .toggle-text span {
      color: #d45f8f;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline wavy #f7a8c9 1.5px;
      text-underline-offset: 5px;
    }

    .error-msg {
      color: #e5546e;
      font-size: 0.95rem;
      text-align: center;
      margin-top: 14px;
      min-height: 24px;
      font-weight: 600;
      background: #fff0f5;
      padding: 6px 10px;
      border-radius: 60px;
      transition: 0.2s;
    }

    .error-msg:empty {
      display: none;
    }

    /* ---------- CHAT LAYOUT (cozy + bubbly) ---------- */
    .chat-container {
      display: none;
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      max-height: 850px;
      background: rgba(255, 245, 250, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 52px;
      border: 2px solid #ffffffc0;
      box-shadow: 0 30px 60px -20px #c08aa0a0, inset 0 0 0 2px #ffffffd0;
      overflow: hidden;
      display: none; /* flex when visible */
      flex-direction: row;
    }

    /* SIDEBAR (friends) */
    .sidebar {
      width: 280px;
      background: #fff5fb;
      border-right: 2px dashed #ffd0e0;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      overflow-y: auto;
      flex-shrink: 0;
      box-shadow: inset -10px 0 20px -20px #c08aa0;
    }

    .sidebar-header {
      font-size: 1.3rem;
      font-weight: 700;
      color: #9b4f7a;
      padding: 0 8px 12px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dotted #f7c2d9;
      margin-bottom: 12px;
    }

    .sidebar-header i {
      color: #e06b9a;
    }

    .friend-search {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .friend-search input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 40px;
      border: 2px solid #ffd9e9;
      background: #ffffffc0;
      font-size: 0.9rem;
      outline: none;
      color: #5a3a4a;
      font-weight: 500;
      transition: 0.2s;
    }

    .friend-search input:focus {
      border-color: #f7a8c9;
      background: white;
      box-shadow: 0 0 0 4px #f7a8c930;
    }

    .friend-search button {
      background: #f7a8c9;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 12px -4px #e06b9a80;
      flex-shrink: 0;
    }

    .friend-search button:hover {
      background: #e06b9a;
      transform: scale(1.05);
    }

    .search-results {
      background: #ffffffd0;
      border-radius: 24px;
      padding: 8px;
      margin-bottom: 16px;
      max-height: 160px;
      overflow-y: auto;
      box-shadow: 0 6px 16px -8px #c08aa0;
      border: 1px solid #ffd9e9;
      display: none;
    }

    .search-results.active {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 40px;
      margin: 4px 0;
      transition: 0.1s;
      background: #fff8fc;
    }

    .search-result-item:hover {
      background: #ffe4f0;
    }

    .search-result-item .name {
      font-weight: 600;
      color: #7a3e60;
    }

    .search-result-item .add-friend {
      background: #b1d8ff;
      border: none;
      color: #1b3b5c;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 6px #b1d8ff80;
    }

    .search-result-item .add-friend:hover {
      background: #8bb8f0;
    }

    .search-result-item .add-friend:disabled {
      opacity: 0.5;
      cursor: default;
      background: #ddd;
    }

    .sidebar-section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #b58aa4;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 8px 8px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .friend-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 60px;
      background: #fff8fc;
      transition: 0.15s;
      cursor: pointer;
      border: 1.5px solid transparent;
      color: #5a3a4a;
      font-weight: 600;
    }

    .friend-item:hover {
      background: #ffe4f0;
      border-color: #f7c2d9;
    }

    .friend-item.active {
      background: #f7c2d9;
      border-color: #e06b9a;
      box-shadow: 0 6px 14px -6px #e06b9a80;
    }

    .friend-item i {
      color: #e06b9a;
      font-size: 1.3rem;
    }

    .friend-item .friend-name {
      flex: 1;
    }

    .friend-request-badge {
      background: #f7a8c9;
      color: white;
      border-radius: 40px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .requests-section {
      margin-top: 12px;
    }

    .request-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff0f7;
      padding: 8px 12px;
      border-radius: 40px;
      margin: 4px 0;
      border-left: 5px solid #f7a8c9;
    }

    .request-item .req-name {
      font-weight: 600;
      color: #7a3e60;
    }

    .request-actions button {
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      margin-left: 4px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .accept-btn {
      background: #b1f0c0;
      color: #1e5a2e;
    }

    .accept-btn:hover {
      background: #8de0a0;
    }

    .decline-btn {
      background: #fcc9d4;
      color: #8a2a3a;
    }

    .decline-btn:hover {
      background: #f9a9b9;
    }

    /* main chat area */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fffbfd;
      overflow: hidden;
      border-radius: 0 52px 52px 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: #fff5fb;
      border-bottom: 2px dashed #ffd0e0;
      box-shadow: 0 4px 12px -8px #c08aa0;
      flex-shrink: 0;
    }

    .chat-header .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #7a3e60;
    }

    .chat-header .user-info i {
      font-size: 2.2rem;
      color: #e06b9a;
      background: #ffe4f0;
      padding: 8px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px #ffffff;
    }

    .chat-header .user-info span {
      font-size: 1.3rem;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
    }

    .chat-header .user-info .chat-with {
      font-size: 0.9rem;
      font-weight: 500;
      color: #b58aa4;
      margin-left: 6px;
    }

    .logout-btn {
      background: #ffd9e9;
      border: none;
      color: #a13e64;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px -4px #f7a8c9;
    }

    .logout-btn:hover {
      background: #f7a8c9;
      color: white;
      transform: scale(1.02);
    }

    /* messages */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #ffffff;
      scroll-behavior: smooth;
    }

    .messages-area::-webkit-scrollbar {
      width: 8px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: #fff0f7;
      border-radius: 20px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: #f7c2d9;
      border-radius: 20px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 14px 20px;
      border-radius: 32px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 8px 18px -8px #c08aa080;
      border: 2px solid #ffffff;
      font-weight: 500;
    }

    .own .bubble {
      background: linear-gradient(135deg, #f9c6db, #f5b0cd);
      color: #4d2a3a;
      border-bottom-right-radius: 8px;
    }

    .other .bubble {
      background: #f2f7ff;
      color: #2c3e5a;
      border-bottom-left-radius: 8px;
      border: 2px solid #dae8ff;
    }

    .bubble img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 24px;
      display: block;
      margin-top: 8px;
      object-fit: contain;
      border: 3px solid white;
      box-shadow: 0 6px 14px -6px #9b4f7a60;
    }

    .meta {
      font-size: 0.7rem;
      color: #b58aa4;
      margin-top: 6px;
      padding: 0 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* input bar */
    .input-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: #fff5fb;
      border-top: 2px dashed #ffd0e0;
      gap: 12px;
      flex-shrink: 0;
    }

    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffe4f0;
      color: #d45f8f;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid #ffffff;
      font-size: 1.4rem;
      flex-shrink: 0;
      box-shadow: 0 6px 12px -6px #f7a8c9;
    }

    .file-label:hover {
      background: #f7c2d9;
      color: white;
      transform: rotate(6deg) scale(1.03);
    }

    .file-label input {
      display: none;
    }

    .input-bar input[type="text"] {
      flex: 1;
      padding: 16px 24px;
      border-radius: 60px;
      border: 2px solid #ffd9e9;
      background: #ffffffc0;
      color: #4d2a3a;
      font-size: 1rem;
      outline: none;
      transition: 0.15s;
      font-weight: 500;
      box-shadow: inset 0 2px 10px #ffe4f060;
    }

    .input-bar input[type="text"]:focus {
      border-color: #f7a8c9;
      background: white;
      box-shadow: 0 0 0 5px #f7a8c930, inset 0 2px 10px #ffe4f060;
    }

    .input-bar input[type="text"]::placeholder {
      color: #d4a5be;
      font-weight: 500;
    }

    .send-btn {
      background: linear-gradient(135deg, #f7a8c9, #e06b9a);
      border: none;
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      box-shadow: 0 8px 18px -6px #e06b9a, 0 0 0 3px #ffffffc0 inset;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #f9b8d4, #e87aaa);
      transform: scale(1.05) rotate(3deg);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* developer credit */
    .dev-credit {
      position: fixed;
      bottom: 10px;
      right: 18px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #c98bb0;
      background: #fff5fbd0;
      padding: 8px 18px;
      border-radius: 60px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px -10px #c08aa0;
      border: 2px solid #ffffffc0;
      letter-spacing: 0.8px;
      z-index: 999;
      font-family: 'Quicksand', sans-serif;
    }

    .dev-credit i {
      color: #e06b9a;
      margin-right: 6px;
    }

    /* utility */
    .hidden {
      display: none !important;
    }

    /* empty state */
    .empty-chat {
      text-align: center;
      padding: 60px 20px;
      color: #d4a5be;
      font-size: 1.2rem;
      font-weight: 600;
      font-style: italic;
    }

    /* responsive */
    @media (max-width: 750px) {
      .chat-container {
        flex-direction: column;
        height: 96vh;
        border-radius: 36px;
      }
      .sidebar {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 2px dashed #ffd0e0;
        padding: 12px;
        flex-direction: row;
        flex-wrap: wrap;
        overflow-y: auto;
      }
      .chat-main {
        border-radius: 0 0 36px 36px;
      }
      .auth-container {
        padding: 28px 18px;
      }
      .bubble {
        font-size: 0.92rem;
        padding: 12px 16px;
      }
      .chat-header {
        padding: 12px 16px;
      }
      .chat-header .user-info span {
        font-size: 1.1rem;
      }
      .dev-credit {
        bottom: 5px;
        right: 8px;
        font-size: 0.7rem;
        padding: 5px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== AUTH SCREEN ========== -->
  <div class="auth-container" id="authScreen">
    <h2><i class="fas fa-comment-dots"></i> ChatFlow</h2>
    <div class="input-group">
      <i class="fas fa-user"></i>
      <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
    </div>
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
    </div>
    <button class="auth-btn" id="loginBtn">Log In</button>
    <button class="auth-btn" id="signupBtn" style="background: linear-gradient(135deg, #d9b0c8, #c78eaf); box-shadow: 0 12px 22px -6px #b57a9a; margin-top: 12px;">Sign Up</button>
    <div class="toggle-text" id="toggleText">
      <span id="switchToSignup">Create account</span>
    </div>
    <div class="error-msg" id="authError"></div>
  </div>

  <!-- ========== CHAT SCREEN ========== -->
  <div class="chat-container" id="chatScreen">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header"><i class="fas fa-users"></i> Friends</div>
      <div class="friend-search">
        <input type="text" id="searchFriendInput" placeholder="Find friends...">
        <button id="searchFriendBtn"><i class="fas fa-search"></i></button>
      </div>
      <div class="search-results" id="searchResults"></div>

      <div class="sidebar-section-title"><i class="fas fa-user-plus"></i> Requests</div>
      <div id="requestsList" class="requests-section"></div>

      <div class="sidebar-section-title"><i class="fas fa-heart"></i> My Friends</div>
      <div id="friendsList" class="friend-list"></div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-main">
      <div class="chat-header">
        <div class="user-info">
          <i class="fas fa-user-circle"></i>
          <span id="displayUsername">User</span>
          <span class="chat-with" id="chatWithLabel"></span>
        </div>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>

      <div class="messages-area" id="messagesArea">
        <div class="empty-chat">✨ Select a friend to start chatting</div>
      </div>

      <div class="input-bar">
        <label class="file-label" for="imageInput">
          <i class="fas fa-image"></i>
          <input type="file" id="imageInput" accept="image/*">
        </label>
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
        <button class="send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- Developer credit -->
  <div class="dev-credit"><i class="fas fa-crown"></i> KING_YOSEF_</div>

  <script>
    (function() {
      // ---------- STORAGE KEYS ----------
      const USERS_KEY = 'chatflow_users';
      const CURRENT_USER_KEY = 'chatflow_currentUser';
      const MESSAGES_KEY = 'chatflow_messages';
      const FRIENDS_KEY = 'chatflow_friends';           // { username: [friend1, friend2] }
      const REQUESTS_KEY = 'chatflow_requests';         // { toUser: [fromUser1, fromUser2] }

      // ---------- DOM ELEMENTS ----------
      const authScreen = document.getElementById('authScreen');
      const chatScreen = document.getElementById('chatScreen');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const signupBtn = document.getElementById('signupBtn');
      const toggleText = document.getElementById('toggleText');
      const authError = document.getElementById('authError');

      const displayUsername = document.getElementById('displayUsername');
      const chatWithLabel = document.getElementById('chatWithLabel');
      const messagesArea = document.getElementById('messagesArea');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const imageInput = document.getElementById('imageInput');
      const logoutBtn = document.getElementById('logoutBtn');

      // sidebar elements
      const searchFriendInput = document.getElementById('searchFriendInput');
      const searchFriendBtn = document.getElementById('searchFriendBtn');
      const searchResults = document.getElementById('searchResults');
      const friendsList = document.getElementById('friendsList');
      const requestsList = document.getElementById('requestsList');

      // ---------- STATE ----------
      let currentUser = null;
      let currentChatFriend = null;        // username of the friend we are chatting with
      let isSignupMode = false;

      // ---------- UTILITIES ----------
      function getUsers() {
        const raw = localStorage.getItem(USERS_KEY);
        return raw ? JSON.parse(raw) : {};
      }

      function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }

      function getMessages() {
        const raw = localStorage.getItem(MESSAGES_KEY);
        return raw ? JSON.parse(raw) : [];
      }

      function saveMessages(messages) {
        localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));
      }

      function getFriends() {
        const raw = localStorage.getItem(FRIENDS_KEY);
        return raw ? JSON.parse(raw) : {};
      }

      function saveFriends(friends) {
        localStorage.setItem(FRIENDS_KEY, JSON.stringify(friends));
      }

      function getRequests() {
        const raw = localStorage.getItem(REQUESTS_KEY);
        return raw ? JSON.parse(raw) : {};
      }

      function saveRequests(requests) {
        localStorage.setItem(REQUESTS_KEY, JSON.stringify(requests));
      }

      function setCurrentUser(username) {
        currentUser = username;
        localStorage.setItem(CURRENT_USER_KEY, username);
      }

      function clearCurrentUser() {
        currentUser = null;
        currentChatFriend = null;
        localStorage.removeItem(CURRENT_USER_KEY);
      }

      // ---------- AUTH UI ----------
      function showAuth() {
        authScreen.style.display = 'block';
        chatScreen.style.display = 'none';
        imageInput.disabled = true;
        authError.textContent = '';
        usernameInput.value = '';
        passwordInput.value = '';
      }

      function showChat() {
        authScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        displayUsername.textContent = currentUser;
        refreshSidebar();
        // if no friend selected, show empty
        if (!currentChatFriend) {
          chatWithLabel.textContent = '';
          messageInput.disabled = true;
          sendBtn.disabled = true;
          imageInput.disabled = true;
          messagesArea.innerHTML = '<div class="empty-chat">✨ Select a friend to start chatting</div>';
        } else {
          chatWithLabel.textContent = `· ${currentChatFriend}`;
          messageInput.disabled = false;
          sendBtn.disabled = false;
          imageInput.disabled = false;
          renderMessages();
        }
      }

      // ---------- FRIEND SYSTEM ----------
      function getFriendsOf(user) {
        const all = getFriends();
        return all[user] || [];
      }

      function addFriendToUser(user, friend) {
        const all = getFriends();
        if (!all[user]) all[user] = [];
        if (!all[user].includes(friend)) all[user].push(friend);
        saveFriends(all);
      }

      function removeFriendFromUser(user, friend) {
        const all = getFriends();
        if (all[user]) {
          all[user] = all[user].filter(f => f !== friend);
          saveFriends(all);
        }
      }

      // send request from currentUser to targetUser
      function sendFriendRequest(targetUser) {
        if (targetUser === currentUser || !getUsers()[targetUser]) return;
        const friends = getFriendsOf(currentUser);
        if (friends.includes(targetUser)) return;

        const requests = getRequests();
        if (!requests[targetUser]) requests[targetUser] = [];
        if (!requests[targetUser].includes(currentUser)) {
          requests[targetUser].push(currentUser);
          saveRequests(requests);
        }
      }

      // accept request from fromUser to currentUser
      function acceptFriendRequest(fromUser) {
        // add to both friends lists
        addFriendToUser(currentUser, fromUser);
        addFriendToUser(fromUser, currentUser);

        // remove request
        const requests = getRequests();
        if (requests[currentUser]) {
          requests[currentUser] = requests[currentUser].filter(u => u !== fromUser);
          saveRequests(requests);
        }

        refreshSidebar();
        // if we are chatting with that friend, update the label
        if (currentChatFriend === fromUser) {
          chatWithLabel.textContent = `· ${currentChatFriend}`;
        }
      }

      // decline request
      function declineFriendRequest(fromUser) {
        const requests = getRequests();
        if (requests[currentUser]) {
          requests[currentUser] = requests[currentUser].filter(u => u !== fromUser);
          saveRequests(requests);
        }
        refreshSidebar();
      }

      // ---------- RENDER SIDEBAR ----------
      function refreshSidebar() {
        if (!currentUser) return;

        // 1. friends list
        const friends = getFriendsOf(currentUser);
        friendsList.innerHTML = '';
        if (friends.length === 0) {
          friendsList.innerHTML = '<div style="padding:12px;color:#b58aa4;font-style:italic;font-weight:500;">No friends yet 🌸</div>';
        } else {
          friends.forEach(friend => {
            const div = document.createElement('div');
            div.className = `friend-item ${currentChatFriend === friend ? 'active' : ''}`;
            const icon = document.createElement('i');
            icon.className = 'fas fa-user-circle';
            const name = document.createElement('span');
            name.className = 'friend-name';
            name.textContent = friend;
            div.append(icon, name);
            div.addEventListener('click', () => {
              // switch chat
              currentChatFriend = friend;
              chatWithLabel.textContent = `· ${friend}`;
              messageInput.disabled = false;
              sendBtn.disabled = false;
              imageInput.disabled = false;
              renderMessages();
              // update active class
              document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
              div.classList.add('active');
            });
            friendsList.appendChild(div);
          });
        }

        // 2. requests
        const requests = getRequests();
        const incoming = requests[currentUser] || [];
        requestsList.innerHTML = '';
        if (incoming.length === 0) {
          requestsList.innerHTML = '<div style="padding:8px 12px;color:#b58aa4;font-style:italic;font-size:0.9rem;">No pending requests</div>';
        } else {
          incoming.forEach(fromUser => {
            const div = document.createElement('div');
            div.className = 'request-item';
            const name = document.createElement('span');
            name.className = 'req-name';
            name.textContent = fromUser;

            const actions = document.createElement('div');
            actions.className = 'request-actions';

            const acceptBtn = document.createElement('button');
            acceptBtn.className = 'accept-btn';
            acceptBtn.type = 'button';
            acceptBtn.setAttribute('aria-label', `Accept friend request from ${fromUser}`);
            acceptBtn.innerHTML = '<i class="fas fa-check"></i>';
            acceptBtn.addEventListener('click', () => acceptFriendRequest(fromUser));

            const declineBtn = document.createElement('button');
            declineBtn.className = 'decline-btn';
            declineBtn.type = 'button';
            declineBtn.setAttribute('aria-label', `Decline friend request from ${fromUser}`);
            declineBtn.innerHTML = '<i class="fas fa-times"></i>';
            declineBtn.addEventListener('click', () => declineFriendRequest(fromUser));

            actions.append(acceptBtn, declineBtn);
            div.append(name, actions);
            requestsList.appendChild(div);
          });
        }
      }

      // ---------- MESSAGES ----------
      function renderMessages() {
        const messages = getMessages().filter(message =>
          (message.from === currentUser && message.to === currentChatFriend) ||
          (message.from === currentChatFriend && message.to === currentUser)
        );

        messagesArea.innerHTML = '';
        if (messages.length === 0) {
          messagesArea.innerHTML = '<div class="empty-chat">✨ Say hello to start chatting</div>';
          return;
        }

        messages.forEach(message => {
          const own = message.from === currentUser;
          const item = document.createElement('div');
          item.className = `message ${own ? 'own' : 'other'}`;

          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          if (message.text) {
            const text = document.createElement('div');
            text.textContent = message.text;
            bubble.appendChild(text);
          }
          if (message.image) {
            const image = document.createElement('img');
            image.src = message.image;
            image.alt = 'Shared image';
            bubble.appendChild(image);
          }

          const meta = document.createElement('div');
          meta.className = 'meta';
          const sentAt = Number(message.timestamp);
          meta.textContent = Number.isFinite(sentAt)
            ? new Date(sentAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : '';

          item.append(bubble, meta);
          messagesArea.appendChild(item);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      function sendMessage(text, image) {
        if (!currentUser || !currentChatFriend || (!text && !image)) return;

        const messages = getMessages();
        messages.push({
          from: currentUser,
          to: currentChatFriend,
          text,
          image,
          timestamp: Date.now()
        });
        saveMessages(messages);
        messageInput.value = '';
        imageInput.value = '';
        renderMessages();
        messageInput.focus();
      }

      // ---------- FRIEND SEARCH ----------
      function renderSearchResults() {
        const query = searchFriendInput.value.trim().toLowerCase();
        searchResults.innerHTML = '';
        searchResults.classList.toggle('active', query.length > 0);
        if (!query) return;

        const users = getUsers();
        const friends = getFriendsOf(currentUser);
        const requests = getRequests();
        const matches = Object.keys(users).filter(username =>
          username.toLowerCase().includes(query) &&
          username !== currentUser &&
          !friends.includes(username)
        );

        if (matches.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'search-result-item';
          empty.textContent = 'No matching users found';
          searchResults.appendChild(empty);
          return;
        }

        matches.forEach(username => {
          const item = document.createElement('div');
          item.className = 'search-result-item';

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = username;

          const button = document.createElement('button');
          button.className = 'add-friend';
          button.type = 'button';
          const alreadyRequested = (requests[username] || []).includes(currentUser);
          button.textContent = alreadyRequested ? 'Requested' : 'Add';
          button.disabled = alreadyRequested;
          button.addEventListener('click', () => {
            sendFriendRequest(username);
            renderSearchResults();
          });

          item.append(name, button);
          searchResults.appendChild(item);
        });
      }

      // ---------- AUTHENTICATION ----------
      function setSignupMode(signupMode) {
        isSignupMode = signupMode;
        loginBtn.hidden = isSignupMode;
        signupBtn.hidden = !isSignupMode;
        toggleText.innerHTML = isSignupMode
          ? 'Already have an account? <span id="switchToSignup">Log in</span>'
          : 'New here? <span id="switchToSignup">Create account</span>';
        authError.textContent = '';
      }

      function authenticate(signupMode) {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          authError.textContent = 'Enter a username and password.';
          return;
        }

        const users = getUsers();
        if (signupMode) {
          if (Object.prototype.hasOwnProperty.call(users, username)) {
            authError.textContent = 'That username is already taken.';
            return;
          }
          users[username] = { password };
          saveUsers(users);
        } else if (!users[username] || users[username].password !== password) {
          authError.textContent = 'Incorrect username or password.';
          return;
        }

        setCurrentUser(username);
        currentChatFriend = null;
        showChat();
      }

      // ---------- EVENT HANDLERS ----------
      loginBtn.addEventListener('click', () => authenticate(false));
      signupBtn.addEventListener('click', () => authenticate(true));
      toggleText.addEventListener('click', event => {
        if (event.target.closest('#switchToSignup')) setSignupMode(!isSignupMode);
      });

      [usernameInput, passwordInput].forEach(input => {
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') authenticate(isSignupMode);
        });
      });

      logoutBtn.addEventListener('click', () => {
        clearCurrentUser();
        showAuth();
      });

      searchFriendBtn.addEventListener('click', renderSearchResults);
      searchFriendInput.addEventListener('input', renderSearchResults);
      searchFriendInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') renderSearchResults();
      });

      sendBtn.addEventListener('click', () => sendMessage(messageInput.value.trim(), ''));
      messageInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') sendMessage(messageInput.value.trim(), '');
      });

      imageInput.addEventListener('change', () => {
        const file = imageInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          authError.textContent = 'Choose a valid image file.';
          imageInput.value = '';
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          authError.textContent = 'Images must be 5 MB or smaller.';
          imageInput.value = '';
          return;
        }

        const reader = new FileReader();
        reader.addEventListener('load', () => {
          if (typeof reader.result === 'string') {
            sendMessage(messageInput.value.trim(), reader.result);
          }
        });
        reader.addEventListener('error', () => {
          authError.textContent = 'The image could not be read. Please try again.';
          imageInput.value = '';
        });
        reader.readAsDataURL(file);
      });

      // Restore a valid session, otherwise start at the login screen.
      const savedUser = localStorage.getItem(CURRENT_USER_KEY);
      setSignupMode(false);
      if (savedUser && getUsers()[savedUser]) {
        currentUser = savedUser;
        showChat();
      } else {
        clearCurrentUser();
        showAuth();
        setSignupMode(false);
      }
    })();
  </script>
</body>
</html>
